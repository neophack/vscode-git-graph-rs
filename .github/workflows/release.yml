name: Release

# A manual, full-pipeline release: run the whole "Build and test" workflow (engine tests, the
# native platform builds on their native runners, the cross-backend integration tests), assemble
# the VSIXs from those binaries, and publish a GitHub Release carrying a universal VSIX (every
# engine that was built) plus one smaller VSIX per platform (only that platform's engine).
#
# By default only the four common engines are built and packaged (Windows x64, Linux x64/arm64,
# macOS arm64); the two niche ones — Windows ARM64 and macOS x64 — are left out, and editors on
# them fall back to the extension's `git` CLI backend. Check `full` to build and package all six.
#
# Trigger it from the Actions tab ("Release" → "Run workflow") or with:
#
#   gh workflow run release.yml -f version=v0.2.0
#
# The tag defaults to the version in package.json; pass `version` to override (the VSIX's version
# is updated to match, so the marketplace id and the tag never disagree).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (defaults to package.json, e.g. v0.2.0)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean
      full:
        description: 'Ship all six engines, including Windows ARM64 and macOS x64'
        required: false
        default: false
        type: boolean

permissions:
  # Creating the release (tag, notes, assets) is the one thing this workflow does beyond CI.
  contents: write

jobs:
  # Everything "Build and test" does: engine tests, the platform builds, integration tests, and
  # the packaged `git-graph-rs` artifact. A release is only made when all of it passes. `full`
  # passed through means all six engines; the default run builds the four common ones.
  build-and-test:
    uses: ./.github/workflows/native-build.yml
    with:
      full: ${{ inputs.full }}

  release:
    name: Publish the release
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The packaged artifact (out/, native/*/git-graph.node, package.json) is laid over the
      # checkout, so the VSIX is assembled from exactly the binaries this run built and tested.
      - uses: actions/download-artifact@v4
        with:
          name: git-graph-rs
          path: .

      - name: Install packaging dependencies
        run: npm ci || npm install

      - name: Resolve the release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="v$(node -p "require('./package.json').version")"
          fi
          case "$VERSION" in
            v*) ;;
            *)  VERSION="v$VERSION" ;;
          esac
          echo "TAG=$VERSION" >> "$GITHUB_ENV"

          # Keep the VSIX version and the tag in agreement when an override was given.
          PKG_VERSION="${VERSION#v}"
          if [ "$(node -p "require('./package.json').version")" != "$PKG_VERSION" ]; then
            npm pkg set version="$PKG_VERSION"
            echo "package.json bumped to $PKG_VERSION to match the tag"
          fi

      - name: Package the VSIX
        run: npm run package

      # One smaller VSIX per platform that was built, each carrying only that platform's engine.
      # The loop follows `native/`, so a default run packages four of them and a `full` run all
      # six. The extension loads `native/<platform>/git-graph.node` and treats every other
      # platform's binary as optional, so a single-engine package needs no code changes.
      #
      # Each is also tagged with `--target`, the identifier the Marketplace uses to hand each
      # user only the package built for their platform (https://code.visualstudio.com/api/working-with-extensions/publishing-extension#platformspecific-extensions).
      # Without it every install — Marketplace or manual — pulls all six engines, which is the
      # `npm run package` universal VSIX's job, not these. Publishing per-platform is still a
      # manual `vsce publish --target <target> --packagePath <file>` per asset below; this step
      # only produces packages that are valid to publish that way.
      # Delegates to scripts/package-platforms.mjs (also used by build-vsix-and-install.bat for a
      # local build), so the stash/restore/--target logic exists in one place. Names its output
      # `git-graph-rs-<package.json version>-<platform>.vsix`, which matches `git-graph-rs-${TAG#v}-*`
      # since the "Resolve the release tag" step above already synced package.json's version to
      # the tag.
      - name: Package the per-platform VSIXs
        run: |
          node scripts/package-platforms.mjs
          ls -l git-graph-rs-*.vsix

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Git Graph RS ${{ env.TAG }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            git-graph-rs-*.vsix

      # A direct download path that does not need the release page.
      - uses: actions/upload-artifact@v4
        with:
          name: git-graph-rs-vsix-${{ env.TAG }}
          path: git-graph-rs-*.vsix
          if-no-files-found: error
