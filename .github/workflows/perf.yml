# The performance gates (REFACTOR-PLAN §6.7, rows P2/P3/P5 + the U9 regression rule): one
# ubuntu job that builds the BASE ref and the PR back-to-back on the same machine, records the
# base run, and gates the PR run against it — the same-machine comparison §6.7 mandates,
# because timing numbers recorded on different machines differ far more than the regressions
# the gate hunts.
#
#   P2 (host pipeline)   the real CommitLoader over the real engine AND the CLI fallback,
#                        driven over the deterministic fast-import fixture
#   P3 (webview render)  the built webview artifact in headless Chromium (ubuntu only)
#   P5 (size)            the dist/ + media/ payloads against the §3.8.1 budgets and a baseline
#
# The comparison policy is U9: a timing item fails when its median regresses more than 5% AND
# the Mann-Whitney test confirms the shift (>= 21 samples per item); size items fail at +2%.
# The absolute size budgets are recorded on every run; failing ON them stays opt-in
# (--enforce-budgets) until the §3.8.2 first-paint slimming brings the un-split webview entry
# inside them — flip the flag on that line when it does.
#
# A nightly schedule (OPTIMIZATION-PLAN §7 P2) runs the P2 gate over the M tier — the tier too
# slow for a PR — plus a fresh S-tier run on the same machine, recorded (not compared: runs on
# different nights are different machine states) and archived as artifacts. The nightly is
# NON-BLOCKING: it never gates a PR, and continue-on-error keeps a red night from marking the
# run red — the report (artifacts + job summary) is the product, per the ADR-0007 calibration
# flow.
#
# Results land in the job artifacts: the per-gate JSON, the recorded baseline, and
# perf-summary.md (also appended to the job summary).

name: Performance gates

on:
  pull_request:
  schedule:
    # 02:50 UTC nightly — the P2 S/M measurement (the non-blocking `nightly` job below).
    - cron: '50 2 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Also run the nightly S/M P2 measurement'
        required: false
        default: false
        type: boolean

# Least privilege: nothing here needs write access; artifacts and the step summary do not.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # One target directory for both trees, so the base build warms the PR build (and the cache).
  CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target

jobs:
  perf:
    name: P2 + P3 + P5 (base vs PR, same machine)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR tree
        uses: actions/checkout@v4

      - name: Check out the base tree (the comparison's other side)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache the cargo target directory
        uses: actions/cache@v4
        with:
          path: cargo-target
          key: perf-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: perf-cargo-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # cargo-zigbuild + zig: every Linux addon build goes through them (the glibc 2.17 floor,
      # ADR 0002) — see scripts/build-addon.mjs. A pinned action and tool version, not a script
      # piped into the shell.
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-zigbuild@0.24.0

      - name: Install zig
        run: pip install ziglang

      - name: Install the Chromium P3 drives (shared browser cache across both trees)
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build the PR tree (release addon, production dist, vendor libs)
        run: |
          node scripts/build-addon.mjs --release
          npm run build:dist -- --production
          node scripts/package-highlight.js

      - name: Record the base run (the same-machine baseline)
        if: github.event_name == 'pull_request'
        working-directory: base
        run: |
          npm ci
          npm install --no-save playwright
          node scripts/build-addon.mjs --release
          npm run build:dist -- --production
          node scripts/package-highlight.js
          node test/perf/run.mjs --gate p2,p3,p5 --samples 21 --tier s --channel chromium --record

      - name: Run the PR gates against the base baseline
        if: github.event_name == 'pull_request'
        run: |
          cp base/test/perf/results/baseline.json test/perf/results/base-baseline.json
          node test/perf/run.mjs --gate p2,p3,p5 --samples 21 --tier s --channel chromium --compare-to test/perf/results/base-baseline.json

      # Manual dispatches have no base side: record only, so the run still produces (and
      # archives) a full set of numbers for the tree it ran on.
      - name: Run the gates (no comparison — manual dispatch)
        if: github.event_name != 'pull_request'
        run: node test/perf/run.mjs --gate p2,p3,p5 --samples 21 --tier s --channel chromium --record

      - name: Append the summary to the job report
        if: always()
        run: cat test/perf/results/perf-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: test/perf/results/
          if-no-files-found: error

  # The nightly S/M measurement (OPTIMIZATION-PLAN §7 P2: "run S/M nightly"): the P2 host gate
  # over the S tier and the M tier — the tier too slow for a PR — on ONE machine, back to back,
  # recorded and archived. Non-blocking: continue-on-error, never a required check; the
  # artifacts and the job summary are the report that ADR-0007's calibration flow reads.
  # Fixtures are regenerated fresh each night (deterministic per seed, so still comparable
  # across nights) — a cache would risk silently measuring a stale generator's shape.
  nightly:
    name: Nightly P2, S and M tiers (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly == true)
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache the cargo target directory
        uses: actions/cache@v4
        with:
          path: cargo-target
          key: perf-nightly-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: perf-nightly-cargo-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-zigbuild@0.24.0

      - name: Install zig
        run: pip install ziglang

      - name: Build the engine addon (P2's engine backend)
        run: |
          npm ci
          node scripts/build-addon.mjs --release

      - name: Generate the fixtures (deterministic per seed; M takes minutes)
        run: |
          node test/perf/fixture.mjs --tier s --out "$RUNNER_TEMP/gg-perf-fixtures/s"
          node test/perf/fixture.mjs --tier m --out "$RUNNER_TEMP/gg-perf-fixtures/m"

      - name: Run P2 on the S tier (record)
        run: node test/perf/run.mjs --gate p2 --tier s --samples 21 --work-dir "$RUNNER_TEMP/gg-perf-fixtures/s" --record

      - name: Run P2 on the M tier (record)
        run: node test/perf/run.mjs --gate p2 --tier m --samples 21 --work-dir "$RUNNER_TEMP/gg-perf-fixtures/m" --record

      - name: Append the summary to the job report
        if: always()
        run: cat test/perf/results/perf-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-nightly-s-m
          path: test/perf/results/
          if-no-files-found: error
