name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Build all nine engines, including Windows ARM64, macOS x64 and the musl/armhf Linux targets'
        required: false
        default: false
        type: boolean
  # Lets the release workflow run this whole pipeline (engine tests, the platform builds,
  # the cross-backend integration tests, packaging) before publishing anything. The `full`
  # input is the release workflow's `full` passed through; without it the two niche engines
  # below are skipped.
  workflow_call:
    inputs:
      full:
        description: 'Build all nine engines, including Windows ARM64, macOS x64 and the musl/armhf Linux targets'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  # A failed build should not also be a slow build.
  CARGO_INCREMENTAL: 0

# Least privilege: this workflow only builds and tests. (When the release workflow calls it, the
# caller's broader token cannot leak in — a called workflow's permissions are capped by its own.)
permissions:
  contents: read

jobs:
  # Every static gate, through the same `npm run check` a developer runs: the four TypeScript
  # projects, ESLint (new violations fail, and so do suppressions that no longer match), stylelint,
  # the dependency rules (new AND stale baseline entries fail), clippy + rustfmt, and the generated
  # engine types (a Rust protocol change whose TypeScript was not regenerated and committed fails).
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the pinned dev toolchain (rust-toolchain.toml), not whatever stable is
        with:
          toolchain: '1.97.1'
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run the static checks
        run: npm run check

  # The engine's own tests, which compare it against what `git` reports for the same question.
  # They need no Node and no addon, so they run first and fail fast.
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the pinned dev toolchain (rust-toolchain.toml), not whatever stable is
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace

      # Coverage only needs to run once, on ubuntu.
      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # One prebuilt binary per platform the extension ships for, built through @napi-rs/cli. napi-rs
  # resolves the Node-API symbols at load time rather than linking against them, so none of these
  # need Node headers, node-gyp or Python — only a Rust toolchain, `npm ci` for the CLI, and, for
  # the cross-compiled Linux target, a linker.
  #
  # By default only the four engines most editors run are built. The five niche ones — Windows
  # ARM64, macOS x64, and the Linux musl (Alpine) x64/arm64 and armhf engines — are skipped: few
  # editors run them, and the extension falls back to the `git` CLI backend when a binary is
  # missing, so those users lose speed, not function. A `full` run (the dispatch input, or the
  # release workflow's `full` passed through) builds all nine.
  #
  # The skip has to live here, inside the matrix: a job-level `if` only sees the github, needs,
  # vars and inputs contexts — no matrix — so filtering on `matrix.target` there fails workflow
  # validation outright. Picking the include list through `full` before the matrix expands means
  # the skipped engines never even get jobs.
  build:
    name: ${{ matrix.directory }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.full && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","directory":"win32-x64-msvc"},{"os":"windows-latest","target":"aarch64-pc-windows-msvc","directory":"win32-arm64-msvc"},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","directory":"linux-x64-gnu"},{"os":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","directory":"linux-arm64-gnu"},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","directory":"linux-x64-musl"},{"os":"ubuntu-latest","target":"aarch64-unknown-linux-musl","directory":"linux-arm64-musl"},{"os":"ubuntu-latest","target":"armv7-unknown-linux-gnueabihf","directory":"linux-armhf"},{"os":"macos-latest","target":"x86_64-apple-darwin","directory":"darwin-x64"},{"os":"macos-latest","target":"aarch64-apple-darwin","directory":"darwin-arm64"}]' || '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","directory":"win32-x64-msvc"},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","directory":"linux-x64-gnu"},{"os":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","directory":"linux-arm64-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin","directory":"darwin-arm64"}]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the pinned dev toolchain (rust-toolchain.toml), not whatever stable is
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # @napi-rs/cli, which the build script drives.
      - name: Install dependencies
        run: npm ci

      # Every Linux addon build goes through cargo-zigbuild (the glibc 2.17 floor, ADR 0002 —
      # build-addon.mjs hard-errors without it, host builds included), so every Linux leg needs
      # the pair. A pinned action and tool version, not a script piped into the shell.
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-zigbuild@0.24.0

      - name: Install zig
        if: runner.os == 'Linux'
        run: pip install ziglang

      # No target needs a linker beyond the Rust toolchain: every Linux build goes
      # through cargo zigbuild, whose zig is also the linker - a target-specific
      # CARGO_TARGET_*_LINKER (the gcc-aarch64 cross linker this job once installed)
      # would override zig and pin the glibc floor to the runner's own libc instead
      # of the 2.17 the .2.17 target suffix promises (the arm64 leg's first real
      # binary-compat run caught exactly that).

      - name: Build the addon
        run: node scripts/build-addon.mjs --release --target ${{ matrix.target }}

      # The binary-compatibility gate (glibc floor on Linux, minos on macOS, static CRT on
      # Windows; scripts/build/check-binary-compat.mjs): run against the engine this matrix leg
      # just built, on its native runner, with the tool skips promoted to failures.
      - name: Check the binary compatibility floors
        env:
          BINARY_COMPAT_REQUIRED: '1'
        run: node scripts/build/check-binary-compat.mjs native
        shell: bash

      # R6 (optimization plan): a per-crate breakdown of the release addon's size, published as
      # the P5 report's evidence. Non-blocking — it informs the size budget, it does not gate —
      # and run once (on the linux-x64-gnu leg): the per-crate split is about the dependency
      # graph, not the platform. Installed through the same pinned action + version pin as the
      # other Rust tooling (S4). cargo bloat rebuilds the addon itself; the plain cargo build is
      # fine here because this report does not ship.
      - name: Install cargo-bloat
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-bloat@0.12.1

      - name: Report the per-crate size breakdown (non-blocking)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        run: |
          cargo bloat --release --crates --manifest-path native/node/Cargo.toml | tee bloat-crates.txt
          {
            echo '### cargo bloat --release --crates (native/node)'
            echo '```'
            cat bloat-crates.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: cargo-bloat-report
          path: bloat-crates.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.directory }}
          path: native/${{ matrix.directory }}/git-graph.node
          if-no-files-found: error

  # The full stack, on the platforms that can run their own binary. This is where the Rust engine
  # and the `git` CLI are checked against each other through the same interface the extension uses.
  integration:
    name: Integration (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            directory: linux-x64-gnu
          - os: windows-latest
            directory: win32-x64-msvc
          - os: macos-latest
            directory: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.directory }}
          path: native/${{ matrix.directory }}

      - name: Install dependencies
        run: npm ci

      # The canonical pipeline (task 1.4): one esbuild bundle on the VS Code 1.38 floor
      # (Node 10.11), the askpass launchers, the webview assets, and the ES2018 compat gates
      # (the in-tree scanner + the es-check CLI, task 1.8) inside build.mjs. This is the same
      # chain `npm run package` ships.
      - name: Build the extension bundle (dist pipeline)
        run: |
          npm run build:dist -- --production
          node scripts/package-highlight.js

      # The unit gate: the Vitest suite over src/** and test/** (vitest.config.ts). On ubuntu it
      # runs with coverage, and fails below the floors set in vitest.config.ts.
      - name: Unit and integration tests (Vitest)
        if: matrix.os != 'ubuntu-latest'
        run: npx vitest run

      - name: Unit and integration tests with coverage (Vitest)
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      # The artifact syntax gate (task 1.8), standalone: re-proves what build.mjs already
      # enforced inline - every dist/ script parses as ES2018.
      - name: Artifact syntax gate (es-check)
        run: node test/compat/artifactSyntax.test.mjs

  # The old-Node runtime smoke (task 1.8, C2): the built bundle must BOOT and serve a real
  # repository read + write on the oldest Node the VS Code 1.38 host ships (10.11), on the
  # transitional 12.x line, and on the current LTS. The bundle is built ONCE on modern Node
  # (the toolchain's own floor) and the matrix legs require nothing but the dist artifact and
  # Node builtins - no devDependency tooling runs on the old Nodes.
  smoke-dist:
    name: Build dist for the runtime smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build the extension bundle (dist pipeline)
        run: npm run build:dist -- --production

      - uses: actions/upload-artifact@v4
        with:
          name: dist-host
          path: dist/extension.js
          if-no-files-found: error

  runtime-smoke:
    name: Runtime smoke (Node ${{ matrix.node-version }})
    needs: smoke-dist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [10.11.0, 12.4.0, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v4
        with:
          name: dist-host
          path: dist

      # The smoke is CommonJS because Node 10/12 cannot parse ES modules: run the .cjs entry
      # directly (runtime-smoke.mjs is a forwarder for modern invocations only).
      - name: Run the runtime smoke
        run: node test/compat/runtime-smoke.cjs

  # The C3 container smoke (R8): the Linux engines must not merely *link* against the two libcs
  # they claim to serve, they must load and answer inside a container that actually runs on each.
  # One leg runs the musl engine on Alpine; the other runs the gnu engine on CentOS 7, whose
  # glibc 2.17 is exactly the floor the *-gnu builds are pinned to (ADR 0002). Both legs drive
  # the addon with plain node — no editor, no extension host — and assert one cheap protocol
  # call, so a symbol the engine references but the host libc lacks fails here and not on a
  # user's machine.
  #
  # The musl engine is not in the default build matrix (the four common engines ship by
  # default), so the musl-engine job builds it on the runner with the same script, the same
  # pinned toolchain and the same zigbuild route the matrix uses. The smoke does not gate
  # packaging: a Docker Hub hiccup should not block a release, but the job fails visibly on
  # every pull request.
  #
  # Images are pinned to version-frozen tags: `centos:centos7` was last pushed when CentOS 7 was
  # retired and is never rebuilt, and the `-alpine3.20` variant tag of the Docker Official Images
  # only ever rebuilds within that Alpine minor. Pin both by manifest-list digest as the
  # follow-up: `docker buildx imagetools inspect <image>`, paste the digest into the matrix.
  # The musl engine the alpine leg loads: built on the runner through the same zigbuild
  # route as the build matrix (the first CI run showed an in-container build pulling a
  # toolchain, zig and pip into node:20-alpine and still failing on the cdylib - the
  # container's job is to LOAD the binary against musl libc, not to build it).
  musl-engine:
    name: Build the musl engine for the container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the pinned dev toolchain (rust-toolchain.toml), not whatever stable is
        with:
          toolchain: '1.97.1'
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: x86_64-unknown-linux-musl
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-zigbuild@0.24.0
      - name: Install zig
        run: pip install ziglang
      - name: Build the musl engine
        run: node scripts/build-addon.mjs --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64-musl
          path: native/linux-x64-musl/git-graph.node
          if-no-files-found: error

  container-smoke:
    name: Container smoke (${{ matrix.name }})
    needs: [build, musl-engine]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Alpine IS musl: the engine and the node that loads it both run on musl libc.
          - name: alpine musl
            directory: linux-x64-musl
            image: node:20-alpine3.20
            node: node
            buildsEngine: false
            legacyNode: ''
          # CentOS 7 is the oldest glibc the gnu engines promise (2.17). Official Node needs
          # glibc 2.28 from version 18 on, so this leg brings the last line built for 2.17
          # (Node 16), fetched on the runner and checksum-verified against nodejs.org's own
          # SHASUMS256.txt before it enters the container.
          - name: centos 7 glibc 2.17
            directory: linux-x64-gnu
            image: centos:centos7
            node: /work/node/bin/node
            buildsEngine: false
            legacyNode: '16.20.2'
    steps:
      - uses: actions/checkout@v4

      # Each leg downloads the engine built on the runner: the gnu engine from the build
      # matrix, the musl engine from the musl-engine job above.
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.directory }}
          path: native/${{ matrix.directory }}
      - name: Fetch Node ${{ matrix.legacyNode }} for the old-glibc container
        if: matrix.buildsEngine != true
        run: |
          curl -fsSLO "https://nodejs.org/dist/v${{ matrix.legacyNode }}/node-v${{ matrix.legacyNode }}-linux-x64.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/v${{ matrix.legacyNode }}/SHASUMS256.txt"
          grep "node-v${{ matrix.legacyNode }}-linux-x64.tar.xz" SHASUMS256.txt | sha256sum -c -
          mkdir node
          tar -xJf "node-v${{ matrix.legacyNode }}-linux-x64.tar.xz" --strip-components=1 -C node

      # No network inside the container: the smoke is filesystem-only by construction. The
      # engineVersion protocol method ignores the repository path, so the call doubles as proof
      # that the JSON seam works, without needing a real repository in the container.
      - name: Load the engine and answer one protocol call
        run: |
          docker run --rm --network none -v "$PWD:/work" -w /work \
            ${{ matrix.image }} \
            ${{ matrix.node }} -e '
              const addon = require(process.argv[1]);
              const version = addon.engineVersion();
              if (typeof version !== "string" || version.length === 0) {
                console.error("engineVersion() answered: " + JSON.stringify(version));
                process.exit(1);
              }
              (async () => {
                const answer = JSON.parse(await addon.request("/tmp", JSON.stringify({ method: "engineVersion", params: {} })));
                if (answer.ok !== version) {
                  console.error("the engineVersion request answered: " + JSON.stringify(answer));
                  process.exit(1);
                }
                console.log("container smoke: engine " + version + " loaded and answered engineVersion");
              })().catch((error) => {
                console.error(error);
                process.exit(1);
              });
            ' /work/${{ matrix.directory }}/git-graph.node
        shell: bash

  # Everything in one place, ready to be dropped into a VSIX.
  package:
    name: Package
    needs: [static, engine, build, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: downloaded

      # The artifacts come down one directory per platform; the extension expects them under
      # `native/<platform>/git-graph.node`, which is where it looks at load time.
      - name: Assemble the native directory
        run: |
          for artifact in downloaded/native-*; do
            directory="${artifact#downloaded/native-}"
            mkdir -p "native/$directory"
            cp "$artifact/git-graph.node" "native/$directory/git-graph.node"
          done
          ls -lR native

      - name: Install dependencies
        run: npm ci

      # The canonical pipeline (task 1.4): the dist bundle + the webview assets are what the
      # VSIX packages (package.json's main points at dist/extension.js). media/vendor/*.min.js
      # are build products too (media/ is gitignored) and the packaged view's HTML loads them,
      # so a run assembled without those steps would ship a VSIX whose view 404s on them.
      - name: Build the extension bundle (dist pipeline)
        run: |
          npm run build:dist -- --production
          node scripts/package-highlight.js

      - uses: actions/upload-artifact@v4
        with:
          name: git-graph-rs
          path: |
            dist/
            media/
            native/*/git-graph.node
            package.json
          if-no-files-found: error
