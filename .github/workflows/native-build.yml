name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Build all six engines, including Windows ARM64 and macOS x64'
        required: false
        default: false
        type: boolean
  # Lets the release workflow run this whole pipeline (engine tests, the platform builds,
  # the cross-backend integration tests, packaging) before publishing anything. The `full`
  # input is the release workflow's `full` passed through; without it the two niche engines
  # below are skipped.
  workflow_call:
    inputs:
      full:
        description: 'Build all six engines, including Windows ARM64 and macOS x64'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  # A failed build should not also be a slow build.
  CARGO_INCREMENTAL: 0

# Least privilege: this workflow only builds and tests. (When the release workflow calls it, the
# caller's broader token cannot leak in — a called workflow's permissions are capped by its own.)
permissions:
  contents: read

jobs:
  # The engine's own tests, which compare it against what `git` reports for the same question.
  # They need no Node and no addon, so they run first and fail fast.
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace

      # Coverage only needs to run once; ubuntu is where clippy/fmt already run.
      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # One prebuilt binary per platform the extension ships for, built through @napi-rs/cli. napi-rs
  # resolves the Node-API symbols at load time rather than linking against them, so none of these
  # need Node headers, node-gyp or Python — only a Rust toolchain, `npm ci` for the CLI, and, for
  # the cross-compiled Linux target, a linker.
  #
  # By default only the four engines most editors run are built. The two niche ones — Windows
  # ARM64 and macOS x64 — are skipped: few editors run them, and the extension falls back to the
  # `git` CLI backend when a binary is missing, so those users lose speed, not function. A `full`
  # run (the dispatch input, or the release workflow's `full` passed through) builds all six.
  #
  # The skip has to live here, inside the matrix: a job-level `if` only sees the github, needs,
  # vars and inputs contexts — no matrix — so filtering on `matrix.target` there fails workflow
  # validation outright. Picking the include list through `full` before the matrix expands means
  # the skipped engines never even get jobs.
  build:
    name: ${{ matrix.directory }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.full && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","directory":"win32-x64-msvc"},{"os":"windows-latest","target":"aarch64-pc-windows-msvc","directory":"win32-arm64-msvc"},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","directory":"linux-x64-gnu"},{"os":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","directory":"linux-arm64-gnu"},{"os":"macos-latest","target":"x86_64-apple-darwin","directory":"darwin-x64"},{"os":"macos-latest","target":"aarch64-apple-darwin","directory":"darwin-arm64"}]' || '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","directory":"win32-x64-msvc"},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","directory":"linux-x64-gnu"},{"os":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","directory":"linux-arm64-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin","directory":"darwin-arm64"}]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # @napi-rs/cli, which the build script drives.
      - name: Install dependencies
        run: npm ci || npm install

      # The only target that needs anything beyond the Rust toolchain.
      - name: Install the cross-linker for arm64 Linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"

      - name: Build the addon
        run: node scripts/build-addon.mjs --release --target ${{ matrix.target }}

      # The binary-compatibility gate (glibc floor on Linux, minos on macOS, static CRT on
      # Windows; scripts/build/check-binary-compat.mjs): run against the engine this matrix leg
      # just built, on its native runner, with the tool skips promoted to failures.
      - name: Check the binary compatibility floors
        env:
          BINARY_COMPAT_REQUIRED: '1'
        run: node scripts/build/check-binary-compat.mjs native/${{ matrix.directory }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.directory }}
          path: native/${{ matrix.directory }}/git-graph.node
          if-no-files-found: error

  # The full stack, on the platforms that can run their own binary. This is where the Rust engine
  # and the `git` CLI are checked against each other through the same interface the extension uses.
  integration:
    name: Integration (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            directory: linux-x64-gnu
          - os: windows-latest
            directory: win32-x64-msvc
          - os: macos-latest
            directory: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.directory }}
          path: native/${{ matrix.directory }}

      - name: Install dependencies
        run: npm ci || npm install

      # The canonical pipeline (task 1.4): one esbuild bundle on the VS Code 1.38 floor
      # (Node 10.11), the askpass launchers, the webview assets, and the ES2018 compat gate
      # inside build.mjs. This is the same chain `npm run package` ships.
      - name: Build the extension bundle (dist pipeline)
        run: |
          npm run build:dist -- --production
          node scripts/package-highlight.js
          node scripts/package-markdown.js

      # The legacy node:test suite still imports out/*.js (build products; out/ is
      # gitignored), so the legacy tsc pipeline keeps running here until the suite drains
      # into Vitest (plan Phase 7). The dist bundle above does not produce out/.
      - name: Build the legacy out/ tree for the legacy test suite
        run: npm run compile-src

      # c8 collects V8 coverage through run-tests.mjs's child processes (it propagates
      # NODE_V8_COVERAGE in the environment) and remaps out/*.js to src/*.ts through the
      # source maps tsc emits, so the report is filed against the TypeScript sources.
      - name: Test
        run: npm run test:node:cov

      # The TypeScript half of the coverage; the Rust half is uploaded by the engine job.
      # Codecov merges the two reports for the same commit. Uploading once from ubuntu is
      # enough — the same suite runs on all three operating systems.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Everything in one place, ready to be dropped into a VSIX.
  package:
    name: Package
    needs: [engine, build, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: downloaded

      # The artifacts come down one directory per platform; the extension expects them under
      # `native/<platform>/git-graph.node`, which is where it looks at load time.
      - name: Assemble the native directory
        run: |
          for artifact in downloaded/native-*; do
            directory="${artifact#downloaded/native-}"
            mkdir -p "native/$directory"
            cp "$artifact/git-graph.node" "native/$directory/git-graph.node"
          done
          ls -lR native

      - name: Install dependencies
        run: npm ci || npm install

      # The canonical pipeline (task 1.4): the dist bundle + the webview assets are what the
      # VSIX packages (package.json's main points at dist/extension.js). media/vendor/*.min.js
      # are build products too (media/ is gitignored) and the packaged view's HTML loads them,
      # so a run assembled without those steps would ship a VSIX whose view 404s on them.
      - name: Build the extension bundle (dist pipeline)
        run: |
          npm run build:dist -- --production
          node scripts/package-highlight.js
          node scripts/package-markdown.js

      - uses: actions/upload-artifact@v4
        with:
          name: git-graph-rs
          path: |
            dist/
            media/
            native/*/git-graph.node
            package.json
          if-no-files-found: error
