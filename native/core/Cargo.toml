[package]
name = "git-graph-core"
description = "Git engine for the Git Graph VS Code extension"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gix = { version = "0.87", default-features = false, features = [
    "revision",
    "blob-diff",
    "status",
    "dirwalk",
    "index",
    "parallel",
    "mailmap",
    "sha1",
] }
bstr = "1"
# Already built for gix-filter; decodes commits whose `encoding` header is not UTF-8.
encoding_rs = "0.8"
thiserror.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
# The single dispatch surface's raw-byte read (`fileBytes`) answers base64, so binary content
# crosses the JSON boundary without an encoding step on either side.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
