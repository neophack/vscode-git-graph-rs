[workspace]
resolver = "2"
members = ["native/core", "native/node"]

[workspace.package]
version = "1.1.0"
edition = "2021"
# The MSRV, held by the `msrv` job in .github/workflows/rust-gates.yml, which runs
# `cargo check --workspace --locked` on exactly this version. It is 1.88, not the 1.82
# REFACTOR-PLAN §3.7.4 documented: gix 0.90 and napi 3 — and 65 other locked crates
# behind them — declare rust-version 1.85 through 1.88, so a 1.82 toolchain cannot
# even resolve the workspace. Restoring 1.82 requires downgrading those crates; until
# then this line states the floor that actually builds. Keep the workflow's toolchain
# in sync when this changes.
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
gix = { version = "0.90", default-features = false }
regex = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lints inherited by every crate that opts in with `[lints] workspace = true`.
# `unsafe_code = "forbid"` turns the "no unsafe in the engine" rule into a compile
# error. `git-graph-core` inherits this table wholesale. The N-API binding
# (`native/node`) cannot: napi-derive generates `#[allow(unsafe_code)]` code that
# `forbid` rejects outright, and cargo does not allow a crate to override
# individual inherited lints - so that crate declares its own `[lints]` table with
# the one scoped allow it needs.
[workspace.lints.rust]
unsafe_code = "forbid"

# A small clippy::pedantic subset, chosen for signal over noise. Levels are "warn";
# CI runs clippy with `-D warnings`, so these fail the build there.
[workspace.lints.clippy]
needless_pass_by_value = "warn"
redundant_clone = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
doc_markdown = "warn"

# The release profile is part of the R6 size budget (optimization plan §5). Measured on the
# Windows dev machine (the win32-x64-msvc `.node`, 2026-10, with the R5 dependency surface):
# thin LTO 5,982,720 B; fat LTO 5,683,200 B (-5.0%, landed); opt-level "z" + fat LTO
# 5,221,888 B (-12.7% total) — not landed, because "z" trades runtime speed the engine's hot
# loops need, and the plan holds opt-level changes for P1's measurements. `panic = "unwind"`
# is load-bearing, not tunable: `protocol`'s `catch_unwind` is what keeps an engine panic from
# taking down the host, and "abort" removes it.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
