<svg xmlns="http://www.w3.org/2000/svg" width="48" height="40" viewBox="-1 -1 12 10">
  <!-- Ferris, the Rust crab, miniaturised: the badge that marks this Git Graph as the Rust one.
       Drawn in a 10x8 box so every icon can place it with a single translate + scale. -->
  <g stroke-linecap="round">
    <g stroke="#d63a00" stroke-width="1.1" fill="none">
      <path d="M 3.1 3.5 L 1.8 2.6"/>
      <path d="M 6.9 3.5 L 8.2 2.6"/>
      <path d="M 1.9 5.7 L 0.7 6.7"/>
      <path d="M 2.1 6.5 L 1.1 7.6"/>
      <path d="M 8.1 5.7 L 9.3 6.7"/>
      <path d="M 7.9 6.5 L 8.9 7.6"/>
    </g>
    <circle cx="1.3" cy="2" r="1.45" fill="#f74c00"/>
    <circle cx="8.7" cy="2" r="1.45" fill="#f74c00"/>
    <ellipse cx="5" cy="4.9" rx="3.5" ry="2.7" fill="#f74c00"/>
    <circle cx="3.6" cy="3.05" r="0.82" fill="#ffffff"/>
    <circle cx="6.4" cy="3.05" r="0.82" fill="#ffffff"/>
    <circle cx="3.72" cy="3.16" r="0.4" fill="#20140f"/>
    <circle cx="6.28" cy="3.16" r="0.4" fill="#20140f"/>
  </g>
</svg>
